               <div style="margin-bottom: 0.2cm;"></div>
               Welcome!
               <div style="margin-bottom: 0.5cm;"></div>
               I am a Ph.D. Candidate in Economics at the University of Oklahoma and an applied microeconomist. My research asks how digital technology, conflict, and inequality of opportunity transform the economic lives of young people in sub-Saharan Africa. I study the effects of armed conflict on youth human capital, internet expansion on fertility in Kenya, and inequality of opportunity in adolescent development. I also have a project on digital payments adoption in Benin in development with J-PAL. Before my doctoral studies, I worked as a Research Assistant and Field Coordinator with the World Bank (DIME), the Center for Evaluation and Development (C4ED), and the Institute for Economic Research in Political Economy (IREEP) in Benin. I hold an M.A. in Economics from the University of Oklahoma and an M.S. in Mathematics, Economics and Statistics from the African School of Economics.
               <div style="margin-bottom: 0.5cm;"></div>
